name: Focused transfer crypto recovery

on:
  push:
    branches: [validation/rff295-crypto-cinder-20261004]

permissions:
  contents: read

concurrency:
  group: rff295-crypto-cinder-20261004
  cancel-in-progress: true

jobs:
  focused-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe08b70814f2a3e9994d457e60f487832680d389
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the single crypto and legacy-recovery regression file
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            node --version
            node -p "require('./node_modules/@stellar/stellar-sdk/package.json').version"
            node_modules/.bin/vitest run test/integration/send-money-crypto-recovery.test.jsx --reporter=verbose
          } 2>&1 | tee crypto-recovery-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rff295-crypto-fe08b708
          path: crypto-recovery-validation.log
          if-no-files-found: warn
          retention-days: 7
