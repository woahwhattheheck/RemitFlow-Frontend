name: Generated transfer record check
on:
  push:
    branches: [rivet/rff295-record-check-20261004]
    paths:
      - .github/workflows/generated-record-check.yml
      - validation/generated-record-check.py
permissions:
  contents: write
jobs:
  record-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 91ccb2cb1071cae139f9be2d503395cb888d9f86
          path: product
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: product
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce and repair generated record ownership
        working-directory: product
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name woahwhattheheck
          git config user.email 293286387+woahwhattheheck@users.noreply.github.com
          python ../control/validation/generated-record-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-record-identity
          path: evidence
          if-no-files-found: warn
          retention-days: 14
