name: RF297 benchmark documentation format
on:
  push:
    branches: [verify/rf297-across-selection-2202]
    paths: [.github/workflows/rf297-across-selection-2202.yml]
permissions:
  contents: read
concurrency:
  group: rf297-across-selection-2202
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ee074a9deb2512b18437664dc74830f1e7f6bc0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install unchanged locked formatter
        run: npm ci --no-audit --no-fund
      - name: Format only new benchmark documentation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rf297-benchmark-format"
          ./node_modules/.bin/prettier --write docs/performance/date-range-clock.mjs docs/performance/date-range-clock.md
          ./node_modules/.bin/prettier --check docs/performance/date-range-clock.mjs docs/performance/date-range-clock.md
          cp docs/performance/date-range-clock.mjs docs/performance/date-range-clock.md "$RUNNER_TEMP/rf297-benchmark-format/"
          git diff --stat
      - name: Return formatter output
        uses: actions/upload-artifact@v4
        with:
          name: rf297-benchmark-format-2202
          path: ${{ runner.temp }}/rf297-benchmark-format
          retention-days: 7
