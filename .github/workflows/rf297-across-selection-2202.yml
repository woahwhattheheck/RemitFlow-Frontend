name: RF297 focused across-page selection
on:
  push:
    branches: [verify/rf297-across-selection-2202]
    paths: [.github/workflows/rf297-across-selection-2202.yml]
permissions:
  contents: read
concurrency:
  group: rf297-across-selection-2202
  cancel-in-progress: false
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: 6ed4086fa9520c36639b5419a42145951a16cd9a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ed4086fa9520c36639b5419a42145951a16cd9a
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install unchanged locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run repaired maintained selection file
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rf297-selection"
          ./node_modules/.bin/vitest run test/integration/select-all-across-pages.test.jsx --reporter=json --outputFile="$RUNNER_TEMP/rf297-selection/repaired.json" > "$RUNNER_TEMP/rf297-selection/repaired.log" 2>&1
          cat "$RUNNER_TEMP/rf297-selection/repaired.log"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/rf297-selection/repaired.json`, 'utf8'));
          const results = data.testResults.flatMap((suite) => suite.assertionResults);
          console.log(results.map(({ fullName, status }) => ({ fullName, status })));
          assert.equal(results.length, 5);
          assert.ok(results.every((result) => result.status === 'passed'));
          console.log('Final composed source: all five maintained selection cases pass, none skipped.');
          JS
          git diff --exit-code
          {
            git rev-parse HEAD
            git hash-object src/pages/Transfers.jsx test/integration/select-all-across-pages.test.jsx src/utils/transferSnapshot.js
            node --version
            npm --version
          } | tee "$RUNNER_TEMP/rf297-selection/source.txt"
      - name: Check formatting only on changed files
        shell: bash
        run: ./node_modules/.bin/prettier --check src/pages/Transfers.jsx test/integration/select-all-across-pages.test.jsx | tee "$RUNNER_TEMP/rf297-selection/format.log"
      - name: Preserve focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf297-across-selection-2202
          path: ${{ runner.temp }}/rf297-selection
          if-no-files-found: warn
          retention-days: 7
